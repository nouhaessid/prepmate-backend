# PrepMate custom login theme
#
# parent=base (not "keycloak") on purpose: the base theme ships the FTL
# logic and default message bundles with none of Keycloak's own
# Patternfly styling, so this theme doesn't have to fight or override
# built-in CSS — resources/css/styles.css is the only styling in play.
parent=base

styles=css/styles.css
scripts=js/scripts.js